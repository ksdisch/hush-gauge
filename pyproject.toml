[project]
name = "hush-gauge"
version = "0.1.0"
description = "Auditing instructed secret-keeping in small Qwen2.5 models: J-lens detection of silent leaks, causal ablation, and unification with mute-map's late-band output off-switch."
requires-python = ">=3.12"
dependencies = [
    # Pinned to match the environment the inherited lens fingerprints were
    # produced in (dim-stage's uv.lock, carried through mute-map) — the lens
    # artifacts in lenses/ are only legitimate under this exact inference stack.
    # Relaxing either pin is a numbered entry in docs/DECISIONS.md (see K6).
    "torch==2.13.0",
    "transformers==5.13.1",
]

[dependency-groups]
dev = [
    # Reads the locally cached WikiText-103 parquet directly, so the oracle's
    # precision/recall sweep runs against real English without pulling `datasets`
    # (which would re-resolve the K6-pinned inference stack). Tests only.
    "pyarrow>=25.0.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
# Runners live at the repo root; tests import them from tests/.
pythonpath = ["."]

[tool.uv]
package = false
